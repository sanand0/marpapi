<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Marp API</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="container py-5">
  <h1 class="mb-4">Marp API</h1>
  <p class="lead">Convert Markdown into HTML slides by posting text to the <code>/marp</code> endpoint.</p>
  <h2>Usage</h2>
  <pre><code>curl -X POST https://&lt;your-worker&gt;.workers.dev/marp -d '# Hello'
</code></pre>
  <h2>Sample Worker Code</h2>
  <pre><code>fetch('/marp', { method: 'POST', body: '# Hello' })</code></pre>
</body>

</html>
